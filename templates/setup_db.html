{% extends 'base.html' %}

{% block title %}Database Setup - Smart Task Manager{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass">
        <div class="auth-header">
            <div class="brand">
                <i class="fa-solid fa-database brand-icon animate-pulse"></i>
                <h2>DATABASE SETUP</h2>
            </div>
            <p>Configure PostgreSQL Connection</p>
        </div>
        
        <form id="form-setup" class="auth-form active" action="/setup-db" method="POST">
            <div class="form-group">
                <label for="setup-host"><i class="fa-solid fa-server"></i> Host</label>
                <input type="text" id="setup-host" name="host" value="{{ host or 'localhost' }}" placeholder="e.g. localhost" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="setup-port"><i class="fa-solid fa-hashtag"></i> Port</label>
                <input type="text" id="setup-port" name="port" value="{{ port or '5432' }}" placeholder="e.g. 5432" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="setup-dbname"><i class="fa-solid fa-database"></i> Database Name</label>
                <input type="text" id="setup-dbname" name="dbname" value="{{ dbname or 'task_db' }}" placeholder="e.g. task_db" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="setup-user"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="setup-user" name="user" value="{{ user or 'postgres' }}" placeholder="e.g. postgres" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="setup-password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="setup-password" name="password" value="{{ password or '' }}" placeholder="Enter database password" autocomplete="off">
            </div>
            <div class="error-msg" id="setup-error" style="display: block; margin-top: 10px;">
                {% if error %}
                    {{ error }}
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">
                <span>Save & Connect</span> <i class="fa-solid fa-circle-play"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
